# Ambiente local completo: PostgreSQL + armazenamento compatível com S3 (MinIO) + site + worker.
# Uso: cp .env.example .env && docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giro
      POSTGRES_PASSWORD: giro
      POSTGRES_DB: giro360
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giro -d giro360"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: giroadmin
      MINIO_ROOT_PASSWORD: giroadmin-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  setup:
    build: .
    env_file: .env
    environment: &internal
      DATABASE_URL: postgresql://giro:giro@postgres:5432/giro360
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
    command: sh -c "npm run db:migrate && npm run storage:setup && npm run admin:create"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"

  web:
    build: .
    env_file: .env
    environment: *internal
    ports: ["3000:3000"]
    depends_on:
      setup: { condition: service_completed_successfully }

  worker:
    build: .
    env_file: .env
    environment: *internal
    command: npm run worker
    depends_on:
      setup: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
