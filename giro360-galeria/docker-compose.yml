# Só para desenvolvimento local: armazenamento compatível com S3 (MinIO), no lugar do R2.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: giroadmin
      MINIO_ROOT_PASSWORD: giroadmin-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8787,http://localhost:3000"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  miniodata:
