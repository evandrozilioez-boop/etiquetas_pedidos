<style>
/* Layout: galeria escura onde as fotos são o foco; painel claro e denso para notebook/iPad. */
:root {
  --ink: #15131c;
  --paper: #f6f5f8;
  --surface: #ffffff;
  --line: #e2dfe8;
  --muted: #6c6879;
  --fg: #1b1924;
  --accent: #ff5a1f;
  --accent-ink: #ffffff;
  --accent-soft: #ffe7dc;
  --ok: #1d8a4e; --ok-soft: #dcf3e5;
  --warn: #a86400; --warn-soft: #fdf0d6;
  --bad: #c0262d; --bad-soft: #fbe1e2;
  --info: #3755c7; --info-soft: #e1e7fb;
  --gallery-bg: #121017; --gallery-fg: #f4f2f7; --gallery-muted: #a7a2b5; --gallery-card: #1d1a25;
  --display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121017; --surface: #1c1924; --line: #302c3b; --muted: #a29db0; --fg: #f1eff5;
  --accent-soft: #3a2017; --ok-soft: #133523; --warn-soft: #3a2a0f; --bad-soft: #3d1517; --info-soft: #1b2348;
  --ok: #4fd08a; --warn: #f2b14a; --bad: #ff7a80; --info: #8ea6ff;
  --gallery-bg: #0c0b10; --gallery-card: #18161f; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121017; --surface: #1c1924; --line: #302c3b; --muted: #a29db0; --fg: #f1eff5;
  --accent-soft: #3a2017; --ok-soft: #133523; --warn-soft: #3a2a0f; --bad-soft: #3d1517; --info-soft: #1b2348;
  --ok: #4fd08a; --warn: #f2b14a; --bad: #ff7a80; --info: #8ea6ff;
  --gallery-bg: #0c0b10; --gallery-card: #18161f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5 }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15 }
button, input, select { font: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* barra do protótipo */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: #fff; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink) }
.proto .wrap { display: flex; gap: 8px; align-items: center; padding-block: 8px; flex-wrap: wrap }
.proto strong { font-family: var(--display); font-size: 14px; margin-right: auto }
.proto small { color: #b9b4c6; font-size: 12px }
.tab { background: transparent; color: #d9d5e2; border: 1px solid #3a3646; border-radius: 999px; padding: 6px 12px; font-size: 13px }
.tab[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 10px 16px; font-weight: 600; min-height: 44px; text-decoration: none }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.big { font-size: 18px; min-height: 60px; padding: 14px 24px; border-radius: 16px; width: 100% }
.btn.ghost { background: transparent }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px }
.btn:disabled { opacity: .5; cursor: not-allowed }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.p-ok { background: var(--ok-soft); color: var(--ok) } .p-warn { background: var(--warn-soft); color: var(--warn) }
.p-bad { background: var(--bad-soft); color: var(--bad) } .p-info { background: var(--info-soft); color: var(--info) }
.p-mute { background: var(--line); color: var(--muted) }

/* ---------- convidado ---------- */
.guest { background: var(--gallery-bg); color: var(--gallery-fg); min-height: 100vh }
.guest .brand { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; font-family: var(--display); font-weight: 700; letter-spacing: .02em }
.guest .brand span { color: var(--accent) }
.cover { position: relative; aspect-ratio: 16/10; max-height: 440px; width: 100%; overflow: hidden }
.cover canvas { width: 100%; height: 100%; object-fit: cover; display: block }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(12,11,16,.92)) }
.cover-text { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding-block: 18px }
.cover-text h1 { font-size: clamp(26px, 6vw, 44px); color: #fff }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: #ddd8e8; font-size: 14px; margin-top: 6px }
.gbody { max-width: 760px; margin: 0 auto; padding-block: 20px 60px; display: grid; gap: 18px }
.gcard { background: var(--gallery-card); border-radius: 18px; padding: 20px; display: grid; gap: 14px }
.gcard p { margin: 0; color: var(--gallery-muted) }
.gcard h2 { font-size: 21px }
.deadline { font-size: 13px; color: var(--gallery-muted); text-align: center }
.code-in { font-size: 24px; letter-spacing: .3em; text-transform: uppercase; text-align: center; padding: 12px; border-radius: 12px; border: 2px solid #3b3647; background: #0f0d14; color: #fff; width: 100% }
.howto { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.howto li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; color: #d9d4e4 }
.howto b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #2b2735; font-size: 13px }
.check { display: flex; gap: 10px; align-items: flex-start; color: #e7e3ee }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 1px }
.choices { display: grid; gap: 10px; grid-template-columns: 1fr 1fr }
@media (max-width: 460px) { .choices { grid-template-columns: 1fr } }
.choice { background: #26222f; color: #fff; border: 1px solid #3b3647; border-radius: 16px; padding: 18px 14px; display: grid; gap: 6px; justify-items: center; text-align: center; min-height: 110px; font-weight: 600 }
.choice svg { width: 30px; height: 30px; stroke: var(--accent) }
.choice small { font-weight: 400; color: var(--gallery-muted); font-size: 12px }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; display: grid; gap: 4px }
.n-warn { background: #3a2a0f; color: #ffd793 } .n-bad { background: #3d1517; color: #ffb3b6 } .n-info { background: #1b2348; color: #c4d0ff } .n-ok { background: #133523; color: #9fe8be }
.testsel { display: flex; flex-wrap: wrap; gap: 6px }
.testsel button { border: 1px solid #3b3647; background: #1a1720; color: #ddd; border-radius: 999px; padding: 6px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center }
.dot { width: 12px; height: 12px; border-radius: 50% }
.selfie-prev { display: flex; gap: 12px; align-items: center }
.selfie-prev canvas { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #222 }
.filters { display: flex; gap: 6px; background: #1d1a25; padding: 4px; border-radius: 12px; width: fit-content }
.filters button { border: 0; background: transparent; color: var(--gallery-muted); padding: 8px 14px; border-radius: 9px; font-weight: 600 }
.filters button[aria-pressed="true"] { background: #fff; color: #15131c }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px }
@media (max-width: 460px) { .grid { grid-template-columns: repeat(2, 1fr) } }
.tile { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: #222 }
.tile canvas { width: 100%; height: 100%; display: block; object-fit: cover }
.tile .badge { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; padding: 2px 8px; border-radius: 6px; display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums }
.tile .sim { position: absolute; right: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 6px }
.spinner { width: 34px; height: 34px; border: 4px solid #3b3647; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s } }
.foot { text-align: center; font-size: 12px; color: var(--gallery-muted); padding-block: 10px 30px }
.foot a { color: var(--gallery-fg) }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 40; background: rgba(8,7,11,.96); display: grid; grid-template-rows: auto 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(12px, env(safe-area-inset-left, 0px)); color: #fff }
.lb-top { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.lb-top button { background: #24212c; color: #fff; border: 0; width: 44px; height: 44px; border-radius: 50%; font-size: 20px }
.lb-stage { display: grid; place-items: center; min-height: 0; position: relative }
.lb-stage canvas { max-width: 100%; max-height: 100%; border-radius: 8px }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(36,33,44,.8); color: #fff; border: 0; width: 44px; height: 44px; border-radius: 50%; font-size: 20px }
.lb-bottom { display: grid; gap: 8px; max-width: 520px; width: 100%; margin: 0 auto }
.lb-bottom small { color: var(--gallery-muted); text-align: center }

/* ---------- painel ---------- */
.admin { min-height: 100vh }
.ahead { background: var(--surface); border-bottom: 1px solid var(--line) }
.ahead .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap }
.logo { font-family: var(--display); font-weight: 700; font-size: 18px }
.logo span { color: var(--accent) }
.anav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap }
.anav button { background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 600 }
.anav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent) }
.amain { max-width: 1180px; margin: 0 auto; padding-block: 22px 60px; display: grid; gap: 18px }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.row h1 { font-size: 26px; margin-right: auto }
.seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); padding: 4px; border-radius: 11px; flex-wrap: wrap }
.seg button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 600 }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--paper) }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px }
.ecard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; text-align: left; padding: 0; color: var(--fg) }
.ecard canvas { width: 100%; aspect-ratio: 16/8; display: block; object-fit: cover }
.ecard .in { padding: 14px; display: grid; gap: 8px }
.ecard h3 { font-size: 17px }
.ecard .nums { display: flex; gap: 14px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0 }
.panel h2 { font-size: 18px }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px }
@media (max-width: 860px) { .two { grid-template-columns: 1fr } }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px }
.stat b { font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums }
.stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em }
.field { display: grid; gap: 6px }
.field label { font-weight: 600; font-size: 13px }
.field input, .field select { border: 1px solid var(--line); background: var(--paper); color: var(--fg); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100% }
.field small { color: var(--muted) }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
.toggle { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none }
.toggle small { display: block; color: var(--muted) }
.qrbox { display: grid; justify-items: center; gap: 10px; text-align: center }
.qrbox .qr { background: #fff; padding: 12px; border-radius: 12px }
.linkline { display: flex; gap: 6px; width: 100%; min-width: 0 }
.linkline code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; text-align: left; user-select: all }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 26px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--paper) }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.drop small { color: var(--muted) }
.uplist { display: grid; gap: 6px }
.up { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px }
.up .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.up .sub { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .2s }
.tablewrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 8px }
td { border-top: 1px solid var(--line); padding: 8px; vertical-align: middle }
td canvas { width: 56px; height: 56px; border-radius: 8px; display: block; object-fit: cover }
.acts { display: flex; gap: 6px; flex-wrap: wrap }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,9,14,.6); display: grid; place-items: center; padding: 16px }
.modal .box { background: var(--surface); color: var(--fg); border-radius: 18px; padding: 20px; width: min(420px, 100%); display: grid; gap: 12px; max-height: 90vh; overflow: auto }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 60; background: var(--fg); color: var(--paper); padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.3) }
.demo-flag { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600 }
.muted { color: var(--muted) }
</style>

<script>
/* ===================== dados fictícios ===================== */
const PERSONAS = [

      mk("photo", [1], { consent: "pending", face: "off" }), mk("video", [0], { status: "processing", face: "queued" })] },
  { id: "e2", name: "Convenção Vendas Sul", date: "2026-10-30", city: "Curitiba/PR", code: "VENDAS",

    media: [mk("photo", [1]), mk("video", [2]), mk("photo", [3])] },

    priv: false, browse: true, faces: false, status: "closed", retention: 90, seed: 41, token: "Zt6Yw2cHn4Ga", media: [] },
];
const BASE = "https://galeria.giro360.com.br";
const fmtDate = (s) => new Date(s + "T12:00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
const addDays = (s, d) => { const x = new Date(s + "T12:00:00"); x.setDate(x.getDate() + d); return x; };
const TODAY = new Date("2026-11-20T12:00:00");
function phase(e) { if (addDays(e.date, e.retention) < TODAY) return "expired"; return e.status; }

const mb = (b) => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB";

/* ===================== ilustrações (canvas) ===================== */
function rnd(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function scene(canvas, seed, personas, opts = {}) {
  const w = canvas.width, h = canvas.height, c = canvas.getContext("2d"), r = rnd(seed + 3);

  if (opts.ring) { c.strokeStyle = "rgba(255,255,255,.25)"; c.lineWidth = h * 0.02; c.beginPath(); c.ellipse(w / 2, h * 0.92, w * 0.42, h * 0.08, 0, 0, 7); c.stroke(); }
  const n = personas.length; const shift = opts.shift || 0;
  personas.forEach((p, i) => {
    const x = w * ((i + 0.5) / n) + Math.sin(shift + i) * w * 0.05, base = h * 0.98, s = Math.min(h * 0.24, w / (n * 3.2));
    c.fillStyle = "rgba(20,18,26,.82)"; c.beginPath(); c.ellipse(x, base, s * 1.15, s * 1.7, 0, Math.PI, 0); c.fill();
    c.fillStyle = PERSONAS[p].color; c.beginPath(); c.arc(x, base - s * 2.15, s * 0.78, 0, 7); c.fill();
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.arc(x - s * 0.25, base - s * 2.25, s * 0.09, 0, 7); c.arc(x + s * 0.25, base - s * 2.25, s * 0.09, 0, 7); c.fill();

function runSearch(cv) {

function overview(tab, e) {

  tab.querySelector("#edit").onclick = () => { const m = document.querySelector(".amain"); m.innerHTML = ""; eventForm(m, e); };
  tab.querySelector("#close").onclick = () => { e.status = e.status === "closed" ? "active" : "closed"; toast(e.status === "closed" ? "Evento encerrado. Downloads continuam até o prazo." : "Evento reaberto"); render(); };
  tab.querySelector("#bio").onclick = () => confirmBox("Excluir dados biométricos deste evento?", "A coleção facial é apagada e a busca por selfie é desligada. Fotos, vídeos e QRs individuais continuam disponíveis.", "Excluir", () => { e.faces = false; e.media.forEach((m) => m.face = "off"); toast("Dados biométricos removidos"); render(); });
}
function makeQR(el, text) {
  try { new QRCode(el, { text, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); }
  catch { el.textContent = "QR indisponível"; el.style.cssText = "width:200px;height:200px;display:grid;place-items:center;color:#555"; }
}
function confirmBox(title, text, label, fn) {
  overlay.innerHTML = ""; const el = h(`<div class="modal"><div class="box"><h2 style="font-size:19px">${title}</h2><p class="muted" style="margin:0">${text}</p><div class="acts"><button class="btn primary" id="y">${label}</button><button class="btn" id="n">Cancelar</button></div></div></div>`);
  el.querySelector("#y").onclick = () => { overlay.innerHTML = ""; fn(); }; el.querySelector("#n").onclick = () => overlay.innerHTML = ""; overlay.append(el);
}
const ST = { queued: ["Na fila", "p-mute"], uploading: ["Enviando", "p-info"], received: ["Recebido", "p-info"], processing: ["Processando", "p-warn"], ready: ["Disponível", "p-ok"], failed: ["Falhou", "p-bad"], waiting: ["Selecione de novo", "p-warn"], duplicate: ["Já enviado", "p-mute"] };
function upload(tab, e) {
  const a = state.a;
  tab.append(h(`<div class="panel"><h2>Enviar fotos e vídeos</h2>
    <div class="drop" id="drop"><b>Arraste uma pasta ou arquivos aqui</b><small>Aceitos: JPEG e PNG até 50 MB · MP4 até 8 GB. Vídeos grandes vão em partes de 16 MB e retomam de onde pararam.</small>
    <div class="acts" style="justify-content:center"><label class="btn primary" for="fi">Selecionar arquivos</label><label class="btn" for="fd">Selecionar pasta</label><button class="btn" id="sample">Usar arquivos de exemplo</button></div>
    <input type="file" id="fi" multiple accept="image/jpeg,image/png,video/mp4" hidden><input type="file" id="fd" webkitdirectory hidden></div>
    <label class="toggle"><input type="checkbox" id="cons"><span><b>Todos os participantes destas capturas autorizaram a busca facial</b><small>Marque só se a autorização foi registrada antes da captura. Na dúvida, deixe desmarcado: o arquivo fica disponível por QR individual, sem biometria.</small></span></label>
    <label class="toggle"><input type="checkbox" id="unst" ${a.unstable ? "checked" : ""}><span><b>Simular internet instável</b><small>Algumas partes falham e são retomadas; um arquivo falha de vez para testar “Tentar novamente”.</small></span></label>
    <div class="row"><h2 style="margin-right:auto">Fila de envio</h2><span class="muted" id="sum"></span><button class="btn sm" id="retry">Tentar novamente os que falharam</button></div><div class="uplist" id="ul"></div></div>`));
  tab.querySelector("#unst").onchange = (x) => a.unstable = x.target.checked;
  const add = (files) => {
    const cons = tab.querySelector("#cons").checked;
    [...files].forEach((f) => {
      const ok = /^(image\/(jpeg|png)|video\/mp4)$/.test(f.type);
      const lim = f.type.startsWith("video") ? 8e9 : 50e6;
      const u = { name: f.name, size: f.size, kind: f.type.startsWith("video") ? "video" : "photo", type: f.type, cons, parts: Math.max(1, Math.ceil(f.size / 16e6)), done: 0, state: "queued", note: "" };
      if (!ok) { u.state = "failed"; u.note = "Formato não aceito. Use JPEG, PNG ou MP4."; u.fatal = true; }
      else if (f.size > lim) { u.state = "failed"; u.note = "Acima do limite de tamanho."; u.fatal = true; }
      else if (a.uploads.some((x) => x.name === f.name && x.size === f.size && x.state === "ready")) { u.state = "duplicate"; u.note = "Este arquivo já foi recebido; nada foi enviado de novo."; }
      a.uploads.unshift(u);
    });
    pump(e); draw();
  };
  tab.querySelector("#fi").onchange = (x) => add(x.target.files);
  tab.querySelector("#fd").onchange = (x) => add(x.target.files);
  const drop = tab.querySelector("#drop");
  drop.ondragover = (x) => { x.preventDefault(); drop.classList.add("over"); }; drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (x) => { x.preventDefault(); drop.classList.remove("over"); add(x.dataTransfer.files); };
  tab.querySelector("#sample").onclick = () => add([
    { name: "totem_0412.jpg", size: 4.1e6, type: "image/jpeg" }, { name: "totem_0413.jpg", size: 3.9e6, type: "image/jpeg" },
    { name: "IMG_0001.jpg", size: 3.2e6, type: "image/jpeg" }, { name: "IMG_0001.jpg", size: 5.6e6, type: "image/jpeg" },
    { name: "giro360_take07.mp4", size: 182e6, type: "video/mp4" }, { name: "convite.pdf", size: 1e6, type: "application/pdf" }]);
  tab.querySelector("#retry").onclick = () => { a.uploads.filter((u) => u.state === "failed" && !u.fatal).forEach((u) => { u.state = "queued"; u.note = "Retomando: " + u.done + " de " + u.parts + " partes já confirmadas"; u.forceOk = true; }); pump(e); draw(); };
  function draw() {
    const ul = tab.querySelector("#ul"); if (!ul) return; ul.innerHTML = "";
    if (!a.uploads.length) ul.append(h(`<p class="muted" style="margin:0">Nenhum arquivo na fila. Experimente “Usar arquivos de exemplo”: inclui dois arquivos com o mesmo nome e conteúdos diferentes, que são preservados.</p>`));
    a.uploads.forEach((u) => { const s = ST[u.state];
      ul.append(h(`<div class="up"><span class="nm">${esc(u.name)}</span><span class="pill ${s[1]}">${s[0]}</span><div class="bar"><i style="width:${u.state === "ready" || u.state === "processing" || u.state === "received" ? 100 : Math.round(u.done / u.parts * 100)}%"></i></div>
        <span class="sub">${u.kind === "video" ? "Vídeo" : "Foto"} · ${mb(u.size)}${u.parts > 1 ? ` · parte ${u.done} de ${u.parts}` : ""}${u.note ? " · " + esc(u.note) : ""}</span></div>`)); });
    const c = (k) => a.uploads.filter((u) => u.state === k).length;

function pump(e) {

        if (a.unstable && !u.forceOk && Math.random() < 0.25) { u.note = `conexão caiu, repetindo parte ${u.done + 1}`; if (u.kind === "video" && u.done > 3 && !u.failedOnce) { u.failedOnce = true; u.state = "failed"; u.note = `envio interrompido. ${u.done} de ${u.parts} partes confirmadas e preservadas`; } return; }

}
const FACE = { indexed: ["Na busca", "p-ok"], queued: ["Na fila da IA", "p-warn"], off: ["Fora da busca", "p-mute"], failed: ["IA falhou", "p-bad"] };
function mediaTab(tab, e) {

  tab.append(h(`<div class="panel"><div class="row"><h2 style="margin-right:auto">Mídias</h2><div class="seg">${[["all", "Todas"], ["photo", "Fotos"], ["video", "Vídeos"], ["pending", "Sem autorização"], ["off", "Despublicadas"]].map(([k, l]) => `<button data-k="${k}" aria-pressed="${a.filter === k}">${l}</button>`).join("")}</div></div>

      <td><span class="pill ${st[1]}">${st[0]}</span></td><td><span class="pill ${fc[1]}">${fc[0]}</span>${m.consent === "pending" ? `<br><small class="muted">aguardando autorização</small>` : ""}</td>
      <td><div class="acts"><button class="btn sm" data-a="qr">QR individual</button><button class="btn sm" data-a="pub">${m.published ? "Despublicar" : "Publicar"}</button>${m.consent === "pending" ? `<button class="btn sm" data-a="ok">Registrar autorização</button>` : ""}</div></td></tr>`);

}
